{% extends "base.html" %}{% load crispy_forms_tags %}{% block title %}Editar banco | Clínica Reina{% endblock %}
{% block content %}<section class="py-5"><div class="container"><div class="card border-0 shadow-sm mx-auto" style="max-width:720px"><div class="card-body p-4"><h1 class="h3">Editar {{ banco.nombre }}</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary" type="submit">Guardar cambios</button><a class="btn btn-outline-secondary" href="{% url 'citas:administrar_bancos' %}">Cancelar</a></form></div></div></div></section>{% endblock %}
