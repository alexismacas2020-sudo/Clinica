{% extends "base.html" %}{% load static crispy_forms_tags %}
{% block title %}Editar especialidad | Clínica Reina{% endblock %}
{% block css %}<link rel="stylesheet" href="{% static 'css/roles_dashboard.css' %}">{% endblock %}
{% block content %}<section class="role-dashboard"><div class="container py-5"><div class="card border-0 shadow-sm mx-auto" style="max-width:760px"><div class="card-body p-4 p-lg-5"><a href="{% url 'especialidades:administrar' %}" class="link-secondary small"><i class="fa-solid fa-arrow-left"></i> Volver</a><h1 class="h3 mt-3">Editar {{ especialidad.nombre }}</h1><form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary" type="submit">Guardar cambios</button></form></div></div></div></section>{% endblock %}
